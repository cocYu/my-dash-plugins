<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>区域截图</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #111; }
    #freeze, #ui {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      display: none;
    }
    body.ready #freeze { display: block; }
    body.ready #ui { display: block; cursor: crosshair; }
    #toolbar {
      position: fixed; display: none; gap: 6px; z-index: 10;
      background: rgba(30, 30, 34, 0.95); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px; padding: 6px 8px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #toolbar button {
      border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px;
      cursor: pointer; font-family: inherit;
    }
    #btn-ok { background: #1971c2; color: #fff; }
    #btn-cancel { background: #3c3d42; color: #ddd; }
    #btn-full { background: #2f9e44; color: #fff; }
    #tip {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      background: rgba(30,30,34,0.92); color: #eee; font-size: 13px;
      padding: 8px 18px; border-radius: 8px; z-index: 10;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="freeze"></canvas>
  <canvas id="ui"></canvas>
  <div id="tip">拖动选择截取区域 · Enter 确认 · Esc 取消 · 双击全屏</div>
  <div id="toolbar">
    <button id="btn-ok">截取</button>
    <button id="btn-full">全屏</button>
    <button id="btn-cancel">取消</button>
  </div>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
